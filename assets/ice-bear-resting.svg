<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" width="230" role="img" aria-label="Ice Bear resting his chin on his paws">
  <defs>
    <linearGradient id="furR" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#FAFBFD"/>
      <stop offset="100%" stop-color="#CBD3DE"/>
    </linearGradient>
    <linearGradient id="furShadeR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B9C2CF"/>
      <stop offset="100%" stop-color="#A5AFC0"/>
    </linearGradient>
    <linearGradient id="railR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2A2E38"/>
      <stop offset="100%" stop-color="#111317"/>
    </linearGradient>
  </defs>

  <!-- rail the paws rest on -->
  <rect x="40" y="228" width="240" height="14" rx="7" fill="url(#railR)"/>

  <!-- far ear -->
  <circle cx="228" cy="46" r="26" fill="url(#furR)" stroke="#20232A" stroke-width="3"/>
  <circle cx="228" cy="48" r="12" fill="url(#furShadeR)"/>

  <!-- head, tilted forward and resting low -->
  <path d="M62 150
           C 52 92, 100 44, 165 44
           C 232 44, 270 92, 262 152
           C 258 182, 236 206, 200 214
           C 170 220, 140 220, 112 212
           C 82 202, 66 180, 62 150 Z"
        fill="url(#furR)" stroke="#20232A" stroke-width="3" stroke-linejoin="round"/>

  <!-- near ear -->
  <circle cx="98" cy="50" r="26" fill="url(#furR)" stroke="#20232A" stroke-width="3"/>
  <circle cx="98" cy="52" r="12" fill="url(#furShadeR)"/>

  <!-- cheek shade -->
  <path d="M70 140 C 68 172, 86 196, 112 206" fill="none" stroke="#B9C2CF" stroke-width="10" stroke-linecap="round" opacity="0.5"/>

  <!-- eyes: content, half-lidded -->
  <path d="M108 130 q18 -10 34 0" fill="none" stroke="#20232A" stroke-width="6" stroke-linecap="round"/>
  <path d="M186 130 q18 -10 34 0" fill="none" stroke="#20232A" stroke-width="6" stroke-linecap="round"/>

  <!-- nose -->
  <ellipse cx="197" cy="160" rx="13" ry="10" fill="#111317"/>

  <!-- smile -->
  <path d="M150 176 q10 12 24 4" fill="none" stroke="#20232A" stroke-width="4" stroke-linecap="round"/>

  <!-- far paw -->
  <ellipse cx="222" cy="234" rx="34" ry="26" fill="url(#furR)" stroke="#20232A" stroke-width="3"/>

  <!-- near paw -->
  <ellipse cx="146" cy="238" rx="38" ry="30" fill="url(#furR)" stroke="#20232A" stroke-width="3"/>
  <path d="M126 236 q20 14 40 0" fill="none" stroke="#B9C2CF" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
</svg>
